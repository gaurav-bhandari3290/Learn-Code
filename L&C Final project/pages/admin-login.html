
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="site-header text-center">
  <img src="../assets/images/logo.png" alt="Logo" class="logo-img">
</header>

<div class="container min-vh-80 d-flex flex-column align-items-center justify-content-center mt-5">
  <div class="col-md-5">
    <h3 class="mb-4 text-center">Login to <strong class="text-highlight">News Aggregator</strong></h3>
    <form action="#" method="get">
      <div class="form-group mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="form-group mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>

      <input type="submit" value="Log In" class="btn btn-block w-100 btn-orange">
    </form>
  </div>
</div>


</body>
</html>

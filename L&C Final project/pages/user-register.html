<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="site-header text-center">
  <img src="../assets/images/logo.png" alt="Logo" class="logo-img">
</header>

  <main class="container d-flex flex-column align-items-center justify-content-center min-vh-80 mt-5">
    <div class="col-md-5">
      <h3 class="mb-4 text-center">Register on <strong class="text-highlight">News Aggregator</strong></h3>
      
      <form action="user-home.html" method="get">
        <div class="form-group mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" required>
        </div>

        <div class="form-group mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="form-group mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>

        <div class="text-center small mb-4">
          Already have an account?
          <a href="user-login.html" class="text-decoration-none text-highlight">Log in</a>
        </div>

        <input type="submit" value="Register" class="btn btn-orange w-100 mb-3">

        
      </form>
    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Choose to login as Admin or User" />
  <meta name="robots" content="index, follow" />
  <title>Select Login Type</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/style.css" />

</head>

<body>
  <main class="login-wrapper">
    <section class="login-card d-flex flex-wrap">

      <div class="col-12 col-md-6 login-card__left d-flex flex-column justify-content-center text-center">
        <h1 class="fw-bold mb-3">Welcome to the News App!</h1>
        <p class="lead">Your gateway to real-time updates, editorial tools, and a seamless news experience.</p>
      </div>

      <div
        class="col-12 col-md-6 login-card__right d-flex flex-column justify-content-center align-items-center text-center">
        <h2 class="mb-3">Sign In As</h2>
        <p class="mb-4">Select your role below to proceed.</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap flex-direction-row">
          <a href="pages/admin_pages/login.html" class="btn-primary w-75" role="button" aria-label="Login as Admin">
            Admin Login
          </a>
          <a href="pages/user_pages/login.html" class="btn-primary w-75" role="button" aria-label="Login as User">
            User Login
          </a>
        </div>
      </div>
    </section>
  </main>
</body>

</html>

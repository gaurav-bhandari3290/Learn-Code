<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
 
</head>

<body>
  <header class="site-header bg-white border-bottom">
    <nav class="navbar navbar-expand-md navbar-light container-fluid px-4 py-2">

      <a class="navbar-brand" href="home.html">
        <img src="../../assets/images/logo.png" alt="Logo" class="logo-img" height="60">
      </a>

      <button class="navbar-toggler ms-auto border-0" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link text-start nav-custom px-3" href="home.html">Headlines</a></li>
          <li class="nav-item"><a class="nav-link text-start nav-custom px-3" href="saved-article.html">Saved Articles</a></li>
          <li class="nav-item"><a class="nav-link text-start nav-custom px-3" href="search.html">Search</a></li>
          <li class="nav-item"><a class="nav-link text-start nav-custom px-3" href="notification.html">Notification</a></li>
          <li class="nav-item"><a class="nav-link text-start nav-custom px-3 active" href="configuration.html">Configuration</a>
          <li class="nav-item d-block d-lg-none ms-3 text-start mt-2"><a href="../../index.html" class="btn btn-primary btn-primary-width">Logout</a></li>
        </ul>
      </div>

      <div class="d-none d-md-block">
        <a href="../../index.html" class="btn btn-primary">Logout</a>
      </div>

    </nav>
  </header>

  <main>
    <div class="container py-5 table-width">
      <div class="row justify-content-between">
        <h2 class="text-center mb-4">Your <span class="text-highlight">Configurations</span></h2>
      </div>
      <div class="category-row">
        <div class="category-label">1. Business</div>
        <button class="btn btn-primary btn-primary-width">Enabled</button>
      </div>

      <div class="category-row">
        <div class="category-label">2. Entertainment</div>
        <button class="btn btn-primary btn-primary-width">Enabled</button>
      </div>

      <div class="category-row">
        <div class="category-label">3. Sports</div>
        <button class="btn btn-disabled" data-bs-toggle="modal" data-bs-target="#Modal">Disabled</button>
      </div>

      <div class="category-row">
        <div class="category-label">4. Technology</div>
        <button class="btn btn-disabled" data-bs-toggle="modal" data-bs-target="#Modal">Disabled</button>
      </div>

      <div class="category-row">
        <div class="category-label">5. Keywords</div>
        <button class="btn btn-primary btn-primary-width">Enabled</button>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="Modal" tabindex="-1" aria-labelledby="sportsModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="sportsModalLabel">Add Keyword</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <input type="text" class="form-control mb-2" placeholder="Enter keyword">
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-disabled" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary btn-primary-width" data-bs-dismiss="modal">Update</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer class="footer-custom mt-5">
    <div class="container d-flex justify-content-md-between justify-content-center align-items-center flex-wrap flex-md-nowrap py-3 flex-md-row flex-column">

      <a href="home.html" class="footer-logo d-flex align-items-center me-3">
        <img src="../../assets/images/logo.png" alt="Logo" class="footer-logo-img">
      </a>

      <div class="text-center flex-grow-1">
        <small class="text-muted">&copy; 2025 News Aggregation. All rights reserved.</small>
      </div>

      <div class="social-icons d-flex gap-3 ms-3">
        <a href="https://www.facebook.com" target="_blank" aria-label="Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://www.twitter.com" target="_blank" aria-label="Twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="https://www.instagram.com" target="_blank" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.linkedin.com" target="_blank" aria-label="LinkedIn">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>

    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-between">
  <h2 class="text-left mb-4 col-6">Your <span class="text-highlight">Configurations</span></h2>
<a href="user-notification.html" class="btn btn-orange col-6 mb-4 w-25 text-right">Notifications</a>
</div>
  <div class="category-row">
      <div class="category-label">1. Business</div>
      <button class="btn btn-orange">Enabled</button>
    </div>

    <div class="category-row">
      <div class="category-label">2. Entertainment</div>
      <button class="btn btn-orange">Enabled</button>
    </div>

    <div class="category-row">
      <div class="category-label">3. Sports</div>
      <button class="btn btn-disabled" data-bs-toggle="modal" data-bs-target="#sportsModal">Disabled</button>
    </div>

    <div class="category-row">
      <div class="category-label">4. Technology</div>
      <button class="btn btn-disabled" data-bs-toggle="modal" data-bs-target="#techModal">Disabled</button>
    </div>

    <div class="category-row">
      <div class="category-label">5. Keywords</div>
      <button class="btn btn-orange">Enabled</button>
    </div>
  </div>

  <!-- Sports Modal -->
  <div class="modal fade" id="sportsModal" tabindex="-1" aria-labelledby="sportsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="sportsModalLabel">Add Keywords for Sports</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <input type="text" class="form-control mb-2" placeholder="Enter keyword">
            <input type="text" class="form-control mb-2" placeholder="Enter keyword">
            <input type="text" class="form-control mb-2" placeholder="Enter keyword">
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-disabled" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-orange" data-bs-dismiss="modal">Update</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Technology Modal -->
  <div class="modal fade" id="techModal" tabindex="-1" aria-labelledby="techModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="techModalLabel">Add Keywords for Technology</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <input type="text" class="form-control mb-2" placeholder="Enter keyword">
            <input type="text" class="form-control mb-2" placeholder="Enter keyword">
            <input type="text" class="form-control mb-2" placeholder="Enter keyword">
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-disabled" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-orange" data-bs-dismiss="modal">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

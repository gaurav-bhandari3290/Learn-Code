<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
 

</head>


<body>
  <main class="login-wrapper">
    <div class="container login-card p-0">
      <div class="row g-0 align-items-stretch h-100">

        <!-- Left Section -->
        <div class="col-12 col-md-6 col-xl-8 login-card__left d-flex flex-column justify-content-center text-center">
          <h1 class="fw-bold mb-3">Welcome back!</h1>
          <p class="mb-0">Login with your existing account.</p>
        </div>

        <!-- Right Section -->
        <div
          class="col-12 col-md-6 col-xl-4 login-card__right d-flex flex-column justify-content-center align-items-center">
          <div class="form-wrapper w-100 px-3">
            <h2 class="fw-bold mb-4 text-center">Sign In</h2>
            <form aria-label="User Login Form" action="home.html" method="get">
              <div class="mb-3">
                <label for="email" class="visually-hidden">Email or Username</label>
                <input type="text" id="email" class="form-control login-card__form-input"
                  placeholder="Email or Username" required />
              </div>
              <div class="mb-3">
                <label for="password" class="visually-hidden">Password</label>
                <input type="password" id="password" class="form-control login-card__form-input" placeholder="Password"
                  required />
              </div>
              <button type="submit" class=" btn-primary">Sign In</button>
              <p class="text-center mt-3 small">Don’t have an account? <a href="register.html">Create one</a></p>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>


</body>

</html>
